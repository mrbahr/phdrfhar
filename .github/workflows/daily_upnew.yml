name: Pharmacy Data Update

on:
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run scraper
        run: python -u phdrfhar.py

      - name: Final commit and push
        run: |
          git add phdrfhar.csv progress_ids.txt
          git diff --staged --quiet || git commit -m "Final update $(date +'%Y-%m-%d')"
          git push
